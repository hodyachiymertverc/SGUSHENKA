name: Deploy to GitHub Pages

# Собирает сайт и генерирует firebase-config.js / admin-config.js
# ПРЯМО ПРИ ДЕПЛОЕ из секретов репозитория (Settings → Secrets and
# variables → Actions), а не из закоммиченных файлов — так реальные
# ключи и пароль вообще никогда не попадают в git-историю и не
# видны в публичном репозитории. Подробности — в SETUP-SECRETS.md.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Сгенерировать firebase-config.js из секретов
        run: |
          cat > firebase-config.js << EOF
          window.FIREBASE_CONFIG = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            databaseURL: "${{ secrets.FIREBASE_DATABASE_URL }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ secrets.FIREBASE_APP_ID }}"
          };
          EOF

      - name: Сгенерировать admin-config.js из секрета
        run: |
          cat > admin-config.js << EOF
          window.ADMIN_PASSWORD = "${{ secrets.ADMIN_PASSWORD }}";
          EOF

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Загрузить артефакт сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
